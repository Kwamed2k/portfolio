name: Deploy Portfolio to AWS S3

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the repository contents
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::867321192876:role/GitHubPortfolioDeployRole
          aws-region: us-east-1

      # Step 3: Deploy website to S3
      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://danielkusi.com \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"

       # Step 4: Purge Cloudflare cache
	- name: Purge Cloudflare Cache
	  run: |
	    curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
		-H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
		-H "Content-Type: application/json" \
		--data '{"purge_everything":true}'	